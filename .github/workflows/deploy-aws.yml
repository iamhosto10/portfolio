name: 🚀 Deploy PRO con Docker

on:
    push:
        branches: ["main"]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4

            # 🐳 Login en Docker Hub
            - name: 🔐 Login Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # 🏗️ Build y push de la imagen
            - name: 🏗️ Build & Push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/mi-portafolio:latest

            # 🚀 Deploy en EC2 (solo pull y run)
            - name: 🚀 Deploy en EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USERNAME }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      # 🔐 Login en Docker Hub (IMPORTANTE)
                        docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
                      # 📥 Descargar imagen
                        docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mi-portafolio:latest

                      # 🛑 Detener contenedor viejo
                        docker stop portafolio-app || true
                        docker rm portafolio-app || true

                      # 🚀 Levantar nuevo contenedor
                        docker run -d -p 80:3000 \
                        --name portafolio-app \
                        ${{ secrets.DOCKERHUB_USERNAME }}/mi-portafolio:latest

