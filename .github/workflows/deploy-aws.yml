name: 🚀 Deploy PRO con Docker

on:
    push:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source
              uses: actions/checkout@v4
            - name: Login to docker hub
              run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            - name: Build Docker Image
              run: docker build -t iamhosto1000/mi-portfolio:latest .
            - name: Publish Image to docker hub
              run: docker push iamhosto1000/mi-portafolio:latest
    deploy:
        needs: build
        runs-on: self-hosted

        steps:
            - name: Pull image from docker hub
              run: docker pull iamhosto1000/easybank:latest
            - name: Delete old container
              run: docker rm -f easybank-container || true
            - name: Run Docker Container
              run: docker run -d -p 80:80 --name easybank-container iamhosto1000/easybank:latest
